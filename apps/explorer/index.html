<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>Files — Worminal</title>
</head>
<body>
  <input id="picker" type="file" webkitdirectory multiple hidden>
  <button id="open" type="button" hidden>Open folder…</button>
  <nav id="sort" aria-label="Sort">
    <button type="button" data-sort="name">Name</button>
    <button type="button" data-sort="extension">Extension</button>
    <button type="button" data-sort="modified">Modified</button>
    <button type="button" data-sort="size">Size</button>
    <button type="button" data-sort="none">Original</button>
  </nav>
  <main id="entries"></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
